services:
  quesuwa:
    image: ghcr.io/desuwadev/quesuwa:latest
    container_name: quesuwa
    restart: unless-stopped
    # Optional. Without it, open /admin and use the setup code from `docker logs quesuwa`.
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      DATA_DIR: /app/data
    ports:
      # Only reachable from this machine; put an HTTPS reverse proxy in front.
      - "127.0.0.1:3100:3100"
    volumes:
      - quesuwa-data:/app/data

volumes:
  quesuwa-data:
