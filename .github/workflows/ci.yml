name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Strict i18n gate
        run: npm run check:i18n
      - run: npm test
      - run: npm run build
      - name: Browser tests
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          REQUIRE_BROWSER: '1'
